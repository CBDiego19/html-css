<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Astronauta</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        img {
            position: absolute;
            top: 0;
            left: 0;

          width: 100vw;
          height: 100vh;
          object-fit: cover;
        }

        .astronauta {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 25vw;
            max-width: 350px;
            min-width: 150px;
            height: auto;
             
        }
    </style>
</head>
<body>
    <img src="espaco.jpg" alt="espaço">
    <img class="astronauta" src="astronauta.png" alt="astronauta">
</body>
</html>
